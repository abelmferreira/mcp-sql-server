name: Publish Docker

# Builds and pushes docker.io/abelmferreira/mcp-sql-server when a v* tag is pushed.
#   vX.Y.Z       -> X.Y.Z, X.Y, X, latest
#   vX.Y.Z-rc.N  -> X.Y.Z-rc.N only (pre-releases never move latest)
# Docker Hub credentials: the repository variable DOCKERHUB_USERNAME (Settings >
# Secrets and variables > Actions > Variables) and the secret DOCKERHUB_TOKEN.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/abelmferreira/mcp-sql-server

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package.json
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "${REF_NAME#v}" != "$pkg_version" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Unit tests run inside the build (stage "test") before anything is pushed.
      - name: Run tests (target "test")
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=mcp-sql-server
            org.opencontainers.image.description=MCP server for SQL Server with read-only mode, built-in SSH tunnel and .env support.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=abelmferreira

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # The Docker Hub repository description is not synced here: it needs a
      # token with "Read, Write, Delete" scope. Edit it on hub.docker.com.
