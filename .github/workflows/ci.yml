name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Bootstrap value only: replaced by a random password in the first
          # step, before anything else can connect. Meets the SQL Server
          # password policy (upper, lower, digit, symbol).
          MSSQL_SA_PASSWORD: Bootstrap-1!-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 1433/tcp
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - name: Set a random password for the test database
        env:
          MSSQL_CONTAINER: ${{ job.services.mssql.id }}
          MSSQL_PORT: ${{ job.services.mssql.ports['1433'] }}
          BOOTSTRAP_PASSWORD: Bootstrap-1!-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # hex digits alone fail the password policy: add a fixed suffix
          pass="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$pass"
          docker exec -e SQLCMDPASSWORD="$BOOTSTRAP_PASSWORD" "$MSSQL_CONTAINER" \
            /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa \
            -Q "ALTER LOGIN sa WITH PASSWORD = '$pass'"
          {
            echo "TEST_MSSQL_SERVER=127.0.0.1"
            echo "TEST_MSSQL_PORT=${MSSQL_PORT}"
            echo "TEST_MSSQL_USER=sa"
            echo "TEST_MSSQL_PASSWORD=${pass}"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` also runs "prepare" (tsc build).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit tests plus the real SQL Server tests (enabled by TEST_MSSQL_SERVER).
      # The SSH tunnel end-to-end test needs sshd containers and runs only
      # through scripts/e2e-ssh-tunnel.sh.
      - name: Tests
        run: npm test

      - name: Check CLI entry point
        run: |
          head -n1 build/index.js | grep -q '^#!/usr/bin/env node' \
            || { echo "::error::build/index.js is missing the node shebang"; exit 1; }

      # The compiled entry point must load under plain Node and stop with a
      # clear configuration error when READONLY is missing.
      - name: Smoke test (missing READONLY)
        run: |
          if env -u READONLY -u TEST_MSSQL_PASSWORD node build/index.js < /dev/null 2> err.txt; then
            echo "::error::server started without READONLY"; exit 1
          fi
          cat err.txt
          grep -q 'READONLY is required' err.txt

      # The package must ship only build/, README.md, LICENSE (and package.json).
      - name: Check package contents
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map(f => f.path);
            const bad = files.filter(f => !/^(build\/|README\.md$|LICENSE$|package\.json$)/.test(f));
            if (bad.length) { console.error("::error::Unexpected files in package: " + bad.join(", ")); process.exit(1); }
            if (!files.includes("build/index.js")) { console.error("::error::build/index.js missing"); process.exit(1); }
            console.log(files.length + " files OK");
          '

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build and run unit tests (target "test")
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: mcp-sql-server:ci
          cache-from: type=gha

      - name: Smoke test (image runs as non-root)
        run: test "$(docker run --rm --entrypoint id mcp-sql-server:ci -u)" = "1000"

      - name: Smoke test (missing READONLY)
        run: |
          if docker run --rm -i mcp-sql-server:ci < /dev/null 2> err.txt; then
            echo "::error::server started without READONLY"; exit 1
          fi
          cat err.txt
          grep -q 'READONLY is required' err.txt
